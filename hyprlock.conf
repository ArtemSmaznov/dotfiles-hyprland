    halign = left
    valign = bottom
    position = 340, 200

    text = cmd[update:1000] /home/artem/.local/bin/get-music.sh artist
    font_size = 24
    font_family = $text_font
    color = rgb($base05)

    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgb($base00)
